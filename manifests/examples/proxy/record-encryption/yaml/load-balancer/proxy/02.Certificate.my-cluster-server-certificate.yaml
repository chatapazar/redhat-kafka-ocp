---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-cluster-server-certificate
  namespace: my-proxy
spec:
  commonName: my-cluster.mykafkaproxy.mycompany.com
  secretName: my-cluster-server-certificate
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 4096
  dnsNames:
    - my-cluster.mykafkaproxy.mycompany.com
    - broker0.my-cluster.mykafkaproxy.mycompany.com
    - broker1.my-cluster.mykafkaproxy.mycompany.com
    - broker2.my-cluster.mykafkaproxy.mycompany.com
  usages:
    - server auth
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
